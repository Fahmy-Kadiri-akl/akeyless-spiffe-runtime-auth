name: publish-host-image

on:
  push:
    branches: [main]
    paths:
      - spire/Dockerfile.host
      - agent/Dockerfile.agent
      - agent/agent-entrypoint.sh
      - app/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akeyless-spiffe-runtime-auth-host
            dockerfile: spire/Dockerfile.host
          - name: akeyless-spiffe-runtime-auth/agent
            dockerfile: agent/Dockerfile.agent
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/fahmy-kadiri-akl/${{ matrix.name }}:latest
            ghcr.io/fahmy-kadiri-akl/${{ matrix.name }}:${{ github.sha }}
