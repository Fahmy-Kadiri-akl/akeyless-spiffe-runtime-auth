# SPIRE server configuration for the akeyless-spiffe-runtime-auth demo.
#
# Self-contained dev trust domain. No UpstreamAuthority is configured, so the
# server self-signs its CA on first run. That is fine for a local demo; for
# production you would point SPIRE at a real upstream authority, for example
# the Akeyless SPIRE Upstream Authority plugin, so Akeyless signs the trust
# root and key rotation is managed for you.

server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    socket_path  = "/tmp/spire-server/private/api.sock"
    trust_domain = "example.org"
    data_dir     = "/opt/spire/.data/server"
    log_level    = "INFO"

    # Lifetimes. Placeholders rendered by spire/up.sh from .env.
    # SPIRE defaults: ca_ttl 24h, default_x509_svid_ttl 1h, default_jwt_svid_ttl 5m.
    ca_ttl                = "@@CA_TTL@@"
    default_x509_svid_ttl = "@@X509_SVID_TTL@@"
    default_jwt_svid_ttl  = "@@JWT_SVID_TTL@@"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/.data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/.data/server/keys.json"
        }
    }
}
