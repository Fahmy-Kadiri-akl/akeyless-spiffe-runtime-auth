# SPIRE agent configuration for the akeyless-spiffe-runtime-auth demo.
#
# Bootstraps insecurely (no pre-shared server bundle) because the server's
# self-signed CA only exists after first run. Acceptable for an isolated local
# dev trust domain; never do this against a production trust domain.

agent {
    data_dir          = "/opt/spire/.data/agent"
    log_level         = "INFO"
    server_address    = "spire-server"
    server_port       = "8081"
    socket_path       = "/tmp/spire-agent/public/api.sock"
    trust_domain      = "example.org"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/.data/agent/keys"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
