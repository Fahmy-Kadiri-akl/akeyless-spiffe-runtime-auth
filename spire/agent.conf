# SPIRE agent configuration for the akeyless-spiffe-runtime-auth demo.

agent {
    data_dir          = "/opt/spire/.data/agent"
    log_level         = "INFO"
    server_address    = "spire-server"
    server_port       = "8081"
    socket_path       = "/tmp/spire-agent/public/api.sock"
    trust_domain      = "example.org"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/.data/agent/keys"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }

    SVIDStore "akeyless_secretsmanager" {
        plugin_cmd = "/opt/spire/AkeylessSecretManager"
        plugin_data {
            akeyless_gateway_url  = "@@GATEWAY_FULL@@/api/v2"
            access_id             = "@@ACCESS_ID@@"
            access_key            = "@@ACCESS_KEY@@"
            target_folder         = "@@SVID_STORE_TARGET_FOLDER@@"
        }
    }
}
