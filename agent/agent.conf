# Standalone spire-agent configuration for a workload host.
# deploy-agent.sh renders the @@SERVER_ADDRESS@@, @@SERVER_PORT@@, and
# @@TRUST_DOMAIN@@ placeholders.
#
# insecure_bootstrap is acceptable for a dev trust domain. In production,
# distribute the server bundle and drop this flag.

agent {
    data_dir          = "/opt/spire/.data/agent"
    log_level         = "INFO"
    server_address    = "@@SERVER_ADDRESS@@"
    server_port       = "@@SERVER_PORT@@"
    socket_path       = "/tmp/spire-agent/public/api.sock"
    trust_domain      = "@@TRUST_DOMAIN@@"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/.data/agent/keys"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
